<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خدماتنا - Our Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    /* تنسيقات مخصصة إضافية */
    .service-box {
      border-radius: 10px; /* زوايا منحنية */
      transition: transform 0.3s ease-in-out; /* حركة بسيطة عند تمرير الماوس */
      height: 100%; /* جعل الصناديق بنفس الارتفاع */
    }
    .service-box:hover {
      transform: translateY(-5px); /* رفع الصندوق قليلاً عند Hover */
    }
    /* تنسيق الأيقونة لتكون كـ "صورة بسيطة" */
    .service-icon {
      font-size: 3rem; /* حجم كبير للأيقونة */
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container mt-5 mb-5">

    <h2 class="text-center mb-5 text-uppercase fw-bold">Our Services</h2>

    <div class="row g-4 text-center">

      <div class="col-md-3 col-sm-6"> <div class="service-box bg-primary text-white p-4 shadow">
          <div class="service-icon">
            <i class="fas fa-paint-brush"></i> </div>
          <h5>Design</h5>
          <p class="small opacity-75">UI & UX</p>
        </div>
      </div>

      <div class="col-md-3 col-sm-6">
        <div class="service-box bg-success text-white p-4 shadow">
          <div class="service-icon">
            <i class="fas fa-code"></i> </div>
          <h5>Development</h5>
          <p class="small opacity-75">Web Apps</p>
        </div>
      </div>

      <div class="col-md-3 col-sm-6">
        <div class="service-box bg-warning p-4 shadow">
          <div class="service-icon text-dark">
            <i class="fas fa-chart-line"></i> </div>
          <h5 class="text-dark">Marketing</h5>
          <p class="small text-dark opacity-75">SEO & Ads</p>
        </div>
      </div>

      <div class="col-md-3 col-sm-6">
        <div class="service-box bg-dark text-white p-4 shadow">
          <div class="service-icon text-danger">
            <i class="fas fa-headset"></i> </div>
          <h5>Support</h5>
          <p class="small opacity-75">24/7 Help</p>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
